<svg xmlns="http://www.w3.org/2000/svg" width="260" height="220" viewBox="0 0 260 220" fill="none">
  <!-- ground shadow -->
  <ellipse cx="130" cy="209" rx="64" ry="7" fill="#E7E9F2"/>

  <!-- legs / pants -->
  <rect x="102" y="146" width="22" height="50" rx="10" fill="#171B2E"/>
  <rect x="136" y="146" width="22" height="50" rx="10" fill="#171B2E"/>

  <!-- boots -->
  <rect x="94" y="190" width="36" height="16" rx="8" fill="#171B2E"/>
  <rect x="130" y="190" width="36" height="16" rx="8" fill="#171B2E"/>

  <!-- left arm (hanging) -->
  <g transform="rotate(-7 81 110)">
    <rect x="72" y="104" width="18" height="52" rx="9" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/>
    <circle cx="81" cy="160" r="10" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/>
  </g>

  <!-- right arm (waving) -->
  <g transform="rotate(18 176 108)">
    <rect x="166" y="54" width="18" height="54" rx="9" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/>
    <circle cx="175" cy="50" r="10" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/>
  </g>

  <!-- torso / safety vest -->
  <rect x="88" y="90" width="84" height="64" rx="18" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>

  <!-- V-neck shirt -->
  <path d="M130 100 L114 132 L146 132 Z" fill="#FFFFFF"/>

  <!-- reflective stripes -->
  <g transform="rotate(12 112 119)">
    <rect x="96" y="115" width="26" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <g transform="rotate(-12 148 119)">
    <rect x="138" y="115" width="26" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- vest hem -->
  <rect x="94" y="147" width="72" height="5" rx="2.5" fill="#D97706"/>

  <!-- head -->
  <circle cx="130" cy="72" r="36" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/>
  <circle cx="94" cy="74" r="7" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/>
  <circle cx="166" cy="74" r="7" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/>

  <!-- eyes -->
  <circle cx="118" cy="70" r="4" fill="#171B2E"/>
  <circle cx="142" cy="70" r="4" fill="#171B2E"/>
  <circle cx="119.4" cy="68.6" r="1.3" fill="#FFFFFF"/>
  <circle cx="143.4" cy="68.6" r="1.3" fill="#FFFFFF"/>

  <!-- smile -->
  <path d="M120 86 Q130 94 140 86" stroke="#171B2E" stroke-width="3" stroke-linecap="round"/>

  <!-- helmet -->
  <path d="M94 60 C94 18 166 18 166 60 Z" fill="#F59E0B"/>
  <path d="M130 58 L130 26" stroke="#D97706" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
  <ellipse cx="118" cy="42" rx="10" ry="5" fill="#FFFFFF" opacity="0.3"/>
  <rect x="88" y="58" width="84" height="12" rx="6" fill="#F59E0B"/>
  <rect x="88" y="66" width="84" height="4" rx="2" fill="#D97706"/>
</svg>
